global
    maxconn 2048

defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend tls_in
    bind :8443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    acl home_hostname req.ssl_sni -m end .home.smarti.dev
    use_backend homes if home_hostname
    default_backend existing_sites

backend homes
    server relay smartihome-relay:8443 resolvers docker init-addr libc,none check

backend existing_sites
    server caddy omnigrid-caddy-1:443 send-proxy-v2 resolvers docker init-addr libc,none check
