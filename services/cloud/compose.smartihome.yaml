name: smartihome
services:
  smartihome:
    container_name: smartihome
    image: smartihome:development
    networks:
      - edge
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      FORWARDED_ALLOW_IPS: "172.18.0.3"
      CLOUD_ORIGIN: https://home.smarti.dev
      CLOUD_RELAY_STATUS_URL: http://smartihome-relay:9443/status
      CLOUD_PROVISION_SECRET_FILE: /run/secrets/provision
    secrets:
      - provision
    volumes:
      - accounts:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
  relay:
    container_name: smartihome-relay
    image: smartihome-relay:development
    networks:
      - edge
    environment:
      CLOUD_DATABASE: /data/cloud.sqlite
      RELAY_BEHIND_TLS_PROXY: "true"
    volumes:
      - accounts:/data:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
  edge-router:
    container_name: smartihome-edge
    image: haproxy@sha256:254e6370f01cd654e0744edf607c67f33777c1b6a9dc0d4b28bcba7171460122
    networks:
      edge:
        ipv4_address: 172.18.0.240
    ports:
      - "443:8443"
    volumes:
      - /home/omni/smartihome/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    restart: unless-stopped
secrets:
  provision:
    file: /home/omni/smartihome/secrets/provision
volumes:
  accounts:

networks:
  edge:
    external: true
    name: omnigrid_default
