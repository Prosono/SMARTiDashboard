name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: make lint test build
      - run: .venv/bin/python scripts/package.py --check
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: make e2e
      - uses: docker/setup-qemu-action@v3
      - run: |
          for pair in amd64:amd64 arm64:aarch64; do
            platform="${pair%%:*}"
            arch="${pair##*:}"
            docker build --platform "linux/$platform" --build-arg "BUILD_ARCH=$arch" -t "smarti:test-$arch" ha-app
            docker run --rm --platform "linux/$platform" --network none -v "$PWD/scripts/container_smoke.py:/tmp/container_smoke.py:ro" "smarti:test-$arch" python /tmp/container_smoke.py
          done

      - name: Prepare isolated mobile pilot
        run: python scripts/prepare_pilot.py "$RUNNER_TEMP/smarti-pilot"
      - name: Test Docker remote-access pilot
        run: |
          docker compose --env-file "$RUNNER_TEMP/smarti-pilot/compose.env" -f pilot/compose.yaml up --build -d
          .venv/bin/python scripts/pilot_client.py "$RUNNER_TEMP/smarti-pilot"
      - name: Stop isolated mobile pilot
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/smarti-pilot/compose.env" ]; then
            docker compose --env-file "$RUNNER_TEMP/smarti-pilot/compose.env" -f pilot/compose.yaml down --volumes
          fi
