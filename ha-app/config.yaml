name: SMARTi
version: "1.36.32"
slug: smarti
url: https://github.com/Prosono/SMARTiDashboard
# Build-tested architecture only; hardware/HAOS validation still required.
arch:
  - amd64
  - aarch64
description: SMARTi home overview, controls, automations and rooms (development preview)
startup: application
boot: manual
init: false
# Bonjour must announce on the physical LAN. HTTP ingress remains proxy-restricted.
host_network: true
homeassistant_api: true
hassio_api: true
hassio_role: manager
map:
  - type: homeassistant_config
    read_only: false
ingress: true
ingress_port: 8099
panel_icon: mdi:home-outline
panel_title: SMARTi
options:
  origin: "https://homeassistant.local:8123"
  additional_origins: []
  auto_local_origins: true
  allow_http_ingress: false
  zigbee2mqtt_base_topic: "zigbee2mqtt"
  zigbee2mqtt_transport: "ha_mqtt"
  zigbee2mqtt_server: ""
  zigbee2mqtt_auth_token: ""
  bootstrap_secret: ""
  remote_installation_id: ""
  remote_credential: ""
schema:
  origin: url
  additional_origins:
    - url
  allow_http_ingress: bool?
  auto_local_origins: bool?
  zigbee2mqtt_base_topic: str?
  zigbee2mqtt_transport: list(ha_mqtt|frontend)?
  zigbee2mqtt_server: str?
  zigbee2mqtt_auth_token: password?
  bootstrap_secret: password
  remote_installation_id: str?
  remote_credential: password?
