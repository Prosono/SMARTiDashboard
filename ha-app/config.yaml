name: SMARTi
version: "0.2.3"
slug: smarti
url: https://github.com/Prosono/SMARTiDashboard
# Build-tested architecture only; hardware/HAOS validation still required.
arch:
  - amd64
  - aarch64
description: SMARTi home controls, rooms and favorites (development preview)
startup: application
boot: manual
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:home-outline
panel_title: SMARTi
options:
  origin: "https://homeassistant.local:8123"
  additional_origins: []
  allow_http_ingress: false
  zigbee2mqtt_base_topic: "zigbee2mqtt"
  bootstrap_secret: ""
schema:
  origin: url
  additional_origins:
    - url
  allow_http_ingress: bool?
  zigbee2mqtt_base_topic: str?
  bootstrap_secret: password
