[project]
name = "smarti"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["qrcode==8.2", "certbot==5.8.0", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1", "websockets>=15,<17", "pydantic-settings>=2.8,<3", "pwdlib[argon2]>=0.2,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
