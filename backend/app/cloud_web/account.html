<!doctype html><html lang="nb"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Din konto · SMARTi</title><script src="/assets/appearance.js?v=2"></script><link rel="stylesheet" href="/assets/admin.css"><link rel="stylesheet" href="/assets/onboarding.css"><link rel="stylesheet" href="/assets/brand.css"><link rel="stylesheet" href="/assets/workspace.css?v=2"><link rel="stylesheet" href="/assets/theme.css?v=7"><header class="masthead"><a href="/">SMARTi <span>Min konto</span></a><nav aria-label="Hovedmeny"><a href="/">Mine hjem</a><a href="/account" aria-current="page">Min konto</a><a href="/support">Support</a></nav></header><main class="intro"><h1>Din SMARTi-konto</h1><p class="account-intro">Fullfør kontaktprofilen din og hold opplysningene dine oppdatert.</p><p id="message" role="status" aria-live="polite"></p><section id="auth" hidden><p>Logg inn eller opprett din egen konto for å ta imot invitasjonen.</p><form id="login"><label>E-post eller eksisterende brukernavn<input name="username" autocomplete="username" required></label><label>Passord<input type="password" name="password" autocomplete="current-password" required></label><button>Logg inn</button></form><details><summary>Opprett en ny konto</summary><form id="signup"><fieldset class="profile-fields"><legend>Din profil</legend><label>Fullt navn<input name="full_name" autocomplete="name" required minlength="2" maxlength="120"></label><div class="two"><label>E-post<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label>Telefonnummer<input name="phone" type="tel" autocomplete="tel" required minlength="6" maxlength="40"></label></div><label>Adresse<input name="address" autocomplete="street-address" required minlength="3" maxlength="240"></label><div class="two"><label>Postnummer<input name="postal_code" autocomplete="postal-code" required minlength="2" maxlength="20"></label><label>Sted<input name="city" autocomplete="address-level2" required minlength="2" maxlength="100"></label></div><label>Land<input name="country" autocomplete="country-name" value="Norge" required minlength="2" maxlength="80"></label><div class="photo-picker"><img id="photo-preview" hidden alt="Ditt valgte profilbilde"><span>Profilbilde (valgfritt)</span><label class="photo-button">Ta bilde<input id="photo-camera" type="file" accept="image/*" capture="user"></label><label class="photo-button">Velg fra bilder<input id="photo-library" type="file" accept="image/*"></label><button type="button" id="photo-remove" hidden>Fjern bilde</button><p id="photo-status" role="status"></p></div></fieldset><label>Velg passord<input type="password" name="password" autocomplete="new-password" minlength="12" required></label><button type="submit">Opprett konto</button></form></details></section><section id="account" hidden><p id="profile-summary"></p><button type="button" id="verify">Send ny bekreftelse på e-post</button><button id="accept" hidden>Godta invitasjonen</button><a id="open" hidden>Åpne hjemmet →</a><h2>Dine hjem og medlemmer</h2><div id="members"></div></section></main><script src="/assets/profile.js"></script><script src="/assets/members.js"></script><script src="/assets/account.js"></script><script src="/assets/brand.js?v=6"></script></html>
